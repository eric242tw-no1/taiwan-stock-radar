# ponytail: Redis/Celery 已於 2026-07-04 移除，此檔僅留 fastapi 直跑定義
version: '3.8'

services:
  fastapi:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    mem_limit: 512m
    volumes:
      - ./backend:/app
      - stockradar_data:/app/data
    command: sh -c "playwright install chromium --with-deps && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  stockradar_data:
