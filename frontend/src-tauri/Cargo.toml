[package]
name = "taiwan-ai-stock-radar"
version = "1.0.0"
description = "Taiwan AI Stock Radar Desktop"
authors = []
license = ""
repository = ""
edition = "2021"

[package.metadata]
tauri = { bundle = { identifier = "com.taiwan.ai.stock.radar" } }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["path-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
